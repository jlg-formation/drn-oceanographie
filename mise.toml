[tools]
uv = "0.12.16"
bun = "1.4.2"

[tasks.prepare]
description = "Reconstruit l'environnement après un `git clean` : .venv (Python) et node_modules (front-end)"
run = [
  "uv sync",
  "bun install",
]

[tasks.tp2_01_explore]
description = "Télécharge (si besoin) et explore le fichier NetCDF SHOM (TP2)"
run = "uv run python TP2/explore.py"

[tasks.tp2_02_train]
description = "Entraîne le MLP de température et exporte le modèle ONNX (TP2)"
run = "uv run python TP2/train_temperature_mlp.py"

[tasks.tp2_03_train_fourier]
description = "Entraîne le MLP + Fourier features et exporte le modèle ONNX (TP2)"
run = "uv run python TP2/train_temperature_mlp.py --fourier"

[tasks.tp2_04_coastline]
description = "Génère le trait de côte Natural Earth recadré (TP2/model/land.geojson)"
run = "uv run python TP2/build_coastline.py"

[tasks.tp2_05_web]
description = "Lance le site web du TP2 (serveur de dev Vite sur http://localhost:5173)"
run = "bun run dev"

[tasks.tp2]
description = "Workflow TP2 complet : explore -> train -> train_fourier -> coastline -> web"
run = [
  "mise run tp2_01_explore",
  "mise run tp2_02_train",
  "mise run tp2_03_train_fourier",
  "mise run tp2_04_coastline",
  "mise run tp2_05_web",
]

[tasks.tp2b_01_train]
description = "Entraîne le MDN de distribution (mélange de gaussiennes) et exporte l'ONNX (TP2b)"
run = "uv run python TP2b/train_temperature_mdn.py"

[tasks.tp2b_02_web]
description = "Lance le site web du TP2b (serveur de dev Vite sur http://localhost:5174)"
run = "bun run dev:tp2b"

[tasks.tp2b]
description = "Workflow TP2b complet : train -> web"
run = [
  "mise run tp2b_01_train",
  "mise run tp2b_02_web",
]

[tasks.tp3_01_explore]
description = "Télécharge (si besoin) et inspecte l'extrait NetCDF GEBCO (TP3)"
run = "uv run python TP3/explore.py"

[tasks.tp3_02_prepare]
description = "Prépare raster Mercator, GeoJSON, grille F10, métadonnées et rapport (TP3/output)"
run = "uv run python TP3/prepare_bathymetry.py"

[tasks.tp3_03_test]
description = "Tests de données et points de contrôle cartographiques (TP3)"
run = "uv run pytest TP3/tests -v"

[tasks.tp3_04_web]
description = "Lance le site web du TP3 (serveur de dev Vite sur http://localhost:5175)"
run = "bun run dev:tp3"

[tasks.tp3]
description = "Workflow TP3 complet : explore -> prepare -> test -> web"
run = [
  "mise run tp3_01_explore",
  "mise run tp3_02_prepare",
  "mise run tp3_03_test",
  "mise run tp3_04_web",
]

[tasks.tp4_01_download]
description = "Télécharge les polygones terrestres OSM et les tuiles Sentinel-2, assemble les scènes (TP4)"
run = "uv run python TP4/download_data.py"

[tasks.tp4_02_dataset]
description = "Génère masques terre/mer, contrôles visuels, patches train/val/test et exemples web (TP4)"
run = "uv run python TP4/prepare_dataset.py"

[tasks.tp4_03_train]
description = "Entraîne le U-Net de segmentation terre/mer (TP4, GPU si disponible)"
run = "uv run python TP4/train_unet.py"

[tasks.tp4_03_train_cpu]
description = "Entraînement réduit pour machine sans GPU (TP4, NF02)"
run = "uv run python TP4/train_unet.py --rapide --cpu"

[tasks.tp4_04_evaluate]
description = "Évalue le U-Net sur les zones de test et les exemples, figures d'erreurs (TP4)"
run = "uv run python TP4/evaluate.py"

[tasks.tp4_05_export]
description = "Exporte le U-Net en ONNX, le vérifie et écrit les métadonnées du site (TP4/model)"
run = "uv run python TP4/export_onnx.py"

[tasks.tp4_06_test]
description = "Tests unitaires et de données (TP4)"
run = "uv run pytest TP4/tests -v"

[tasks.tp4_07_web]
description = "Lance le site « Terre ou Mer ? » (serveur de dev Vite sur http://localhost:5176)"
run = "bun run dev:tp4"

[tasks.tp4]
description = "Workflow TP4 complet : download -> dataset -> train -> evaluate -> export -> test -> web"
run = [
  "mise run tp4_01_download",
  "mise run tp4_02_dataset",
  "mise run tp4_03_train",
  "mise run tp4_04_evaluate",
  "mise run tp4_05_export",
  "mise run tp4_06_test",
  "mise run tp4_07_web",
]

[tasks.tp5_01_download]
description = "Télécharge 5 ans de hauteurs horaires validées du marégraphe de Brest (API REFMAR, TP5)"
run = "uv run python TP5/download_data.py"

[tasks.tp5_02_prepare]
description = "Contrôle qualité, figures exploratoires, fenêtres 48 h -> 24 h et séparation chronologique (TP5)"
run = "uv run python TP5/prepare_dataset.py"

[tasks.tp5_03_train]
description = "Entraîne RNN, GRU et LSTM sur les mêmes fenêtres (TP5, GPU si disponible)"
run = "uv run python TP5/train.py"

[tasks.tp5_03_train_cpu]
description = "Entraînement réduit pour machine sans GPU (TP5, NF02)"
run = "uv run python TP5/train.py --rapide --cpu"

[tasks.tp5_04_evaluate]
description = "Évalue réseaux et références naïves sur le jeu de test, par échéance (TP5)"
run = "uv run python TP5/evaluate.py"

[tasks.tp5_05_export]
description = "Exporte les trois réseaux en ONNX, les vérifie et écrit les données du site (TP5/model)"
run = "uv run python TP5/export_onnx.py"

[tasks.tp5_06_test]
description = "Tests unitaires et de données (TP5)"
run = "uv run pytest TP5/tests -v"

[tasks.tp5_07_web]
description = "Lance MaréeLab (serveur de dev Vite sur http://localhost:5177)"
run = "bun run dev:tp5"

[tasks.tp5]
description = "Workflow TP5 complet : download -> prepare -> train -> evaluate -> export -> test -> web"
run = [
  "mise run tp5_01_download",
  "mise run tp5_02_prepare",
  "mise run tp5_03_train",
  "mise run tp5_04_evaluate",
  "mise run tp5_05_export",
  "mise run tp5_06_test",
  "mise run tp5_07_web",
]
