[project]
name = "drn-oceanographie"
version = "0.1.0"
description = "Formation ORSYS DRN avec données océanographique"
readme = "README.md"
authors = [
    { name = "Jean-Louis GUENEGO", email = "jlguenego@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
]

[project.scripts]
drn-oceanographie = "drn_oceanographie:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
